server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — any path not matching a real file goes to index.html
    # so React Router can handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Streaming chat responses need buffering disabled, or nginx will wait
    # for the whole response before forwarding it — defeating the point of
    # SSE token-by-token streaming.
    location /api/chat/stream {
        proxy_pass http://backend:8000/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 25M; # matches backend MAX_UPLOAD_SIZE_MB with headroom
    }
}
